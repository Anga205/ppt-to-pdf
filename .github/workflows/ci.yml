name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (LibreOffice)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice libreoffice-impress libreoffice-writer fonts-dejavu

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate test fixtures
        run: python tests/fixtures/generate_fixtures.py

      - name: Run pytest suite (default concurrency)
        env:
          CONCURRENT_CONVERSIONS: "1"
        run: python -m pytest tests/ -v

      - name: Run concurrency tests with different CONCURRENT_CONVERSIONS
        env:
          CONCURRENT_CONVERSIONS: "4"
        run: python -m pytest tests/test_concurrency.py -v
      - name: Run document conversion tests
        env:
          CONCURRENT_CONVERSIONS: "1"
        run: python -m pytest tests/test_document.py -v

  integration:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        concurrent: ["1", "3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (LibreOffice)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice libreoffice-impress libreoffice-writer fonts-dejavu

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate test fixtures
        run: python tests/fixtures/generate_fixtures.py

      - name: Start service
        env:
          CONCURRENT_CONVERSIONS: ${{ matrix.concurrent }}
        run: |
          python main.py > /tmp/service.log 2>&1 &
          echo "service started"

      - name: Wait for service and run HTTP integration tests
        env:
          CONCURRENT_CONVERSIONS: ${{ matrix.concurrent }}
          BASE_URL: "http://127.0.0.1:8000"
        run: |
          python tests/integration_test.py

      - name: Show service log on failure
        if: failure()
        run: cat /tmp/service.log
